[package]
name = "cli-tools-vres"
description = "Add video resolution to file names"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"

[[bin]]
name = "vres"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
cli-tools-dots = { workspace = true }
cli-tools-media = { workspace = true, features = ["scan-cache"] }
colored = { workspace = true }
dunce = { workspace = true }
indicatif = { workspace = true }
rayon = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
walkdir = { workspace = true }
cli-tools-common = { workspace = true, features = ["completion", "config", "diff"] }
cli-tools-db = { workspace = true }

[dev-dependencies]
cli-tools-common = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }

[lints]
workspace = true
