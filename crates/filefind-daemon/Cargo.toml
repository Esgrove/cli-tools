[package]
name = "filefind-daemon"
description = "Background filefind daemon that indexes files and follows file system changes"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"

[[bin]]
name = "filefindd"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
cli-tools-common = { workspace = true, features = ["completion"] }
clap = { workspace = true }
clap_complete = { workspace = true }
colored = { workspace = true }
dirs = { workspace = true }
filefind-common = { workspace = true, features = ["clap", "ipc", "logging"] }
futures = { workspace = true }
notify = { workspace = true }
rayon = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[dev-dependencies]
dunce = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
