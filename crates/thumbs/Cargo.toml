[package]
name = "cli-tools-thumbs"
description = "Create video thumbnail sheets"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"

[[bin]]
name = "thumbs"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
cli-tools-common = { workspace = true, features = ["completion", "config"] }
cli-tools-db = { workspace = true }
cli-tools-media = { workspace = true, features = ["scan-cache"] }
colored = { workspace = true }
ctrlc = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
cli-tools-common = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
