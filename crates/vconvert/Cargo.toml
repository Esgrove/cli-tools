[package]
name = "cli-tools-vconvert"
description = "Convert video files to HEVC in an MP4 container"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"

[lib]
path = "src/lib.rs"

[[bin]]
name = "vconvert"
path = "src/bin/vconvert/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# Dependencies of the vconvert binary, left out by library users with `default-features = false`.
cli = [
    "cli-tools-common/completion",
    "cli-tools-common/config",
    "cli-tools-common/diff",
    "dep:clap",
    "dep:clap_complete",
    "dep:colored",
    "dep:ctrlc",
    "dep:dirs",
    "dep:filefind-common",
    "dep:indicatif",
    "dep:itertools",
    "dep:jiff",
    "dep:toml",
]

[dependencies]
anyhow = { workspace = true }
cli-tools-common = { workspace = true }
cli-tools-db = { workspace = true }
cli-tools-media = { workspace = true, features = ["scan-cache"] }
rayon = { workspace = true }
regex = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
tempfile = { workspace = true }
walkdir = { workspace = true }

clap = { workspace = true, optional = true }
clap_complete = { workspace = true, optional = true }
colored = { workspace = true, optional = true }
ctrlc = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }
filefind-common = { workspace = true, optional = true }
indicatif = { workspace = true, optional = true }
itertools = { workspace = true, optional = true }
jiff = { workspace = true, optional = true }
toml = { workspace = true, optional = true }

[dev-dependencies]
toml = { workspace = true }

[[test]]
name = "vconvert_cli_tests"
required-features = ["cli"]

[lints]
workspace = true
