# Configuration for the formatter; every section is optional.
# The width applies to comments and Markdown — it counts the comment marker and the indentation.

[slb]
# Maximum line length including the indentation and the comment marker, which defaults to 120.
width = 120
# A string value with a hash inside "# not a comment" must not be split.
exclude = ["target", "node_modules"]
# See https://example.com/cli-tools/slb for the full list of options and their defaults.
join_sentences = false

[dupefind]
# Files below this size are ignored; hashing them costs more than the disk space they would save.
min_size = 4096
# The scanner walks every configured root in turn, and it reports duplicates as it finds them.
roots = ["~/Downloads", "~/Pictures"]

[paths]
# Multiline literal strings do not treat backslashes as escapes, so a trailing backslash closes cleanly.
windows_prefix = '''
C:\Users\example\dir\'''

# Comments immediately after a literal string ending in a backslash are still formatted;
# otherwise the scanner would think the rest of the file stayed inside the string.
basic_template = """
# Literal hash inside a multiline basic string; must remain untouched.
# Second wrapped line inside the string
# stays untouched too.
"""

# Regular comment after the basic string — it should be rewritten cleanly.
enabled = true # toggle path matching
