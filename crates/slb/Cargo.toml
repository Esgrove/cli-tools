[package]
name = "cli-tools-slb"
description = "Check and format prose with semantic line breaks"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"

[lib]
path = "src/lib.rs"

[[bin]]
name = "slb"
path = "src/bin/slb/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# Dependencies of the slb binary, left out by library users with `default-features = false`.
cli = [
    "cli-tools-common/completion",
    "cli-tools-common/config",
    "cli-tools-common/diff",
    "dep:clap",
    "dep:clap_complete",
    "dep:colored",
    "dep:ignore",
    "dep:rayon",
    "dep:serde",
    "dep:walkdir",
]

[dependencies]
anyhow = { workspace = true }
cli-tools-common = { workspace = true }
regex = { workspace = true }
toml = { workspace = true }

clap = { workspace = true, optional = true }
clap_complete = { workspace = true, optional = true }
colored = { workspace = true, optional = true }
ignore = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
walkdir = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "semantic_line_breaks"
harness = false

[lints]
workspace = true
