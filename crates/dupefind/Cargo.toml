[package]
name = "cli-tools-dupefind"
description = "Find duplicate files"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"

[lib]
path = "src/lib.rs"

[[bin]]
name = "dupefind"
path = "src/bin/dupefind/main.rs"

[dependencies]
anyhow = { workspace = true }
blake3 = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
colored = { workspace = true }
crossterm = { workspace = true }
ctrlc = { workspace = true }
indicatif = { workspace = true }
itertools = { workspace = true }
ratatui = { workspace = true }
rayon = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
walkdir = { workspace = true }
cli-tools-common = { workspace = true, features = ["completion", "config", "diff", "sqlite"] }
cli-tools-media = { workspace = true, features = ["scan-cache"] }

[dev-dependencies]
cli-tools-common = { workspace = true, features = ["test-support"] }
proptest = { workspace = true }
tempfile = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "dupe_find"
harness = false

[lints]
workspace = true
