[package]
name = "cli-tools-dirmove"
description = "Move files to matching directories"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"

[lib]
path = "src/lib.rs"

[[bin]]
name = "dirmove"
path = "src/bin/dirmove/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# Dependencies of the dirmove binary, left out by library users with `default-features = false`.
cli = [
    "cli-tools-common/completion",
    "cli-tools-common/config",
    "cli-tools-media/scan-cache",
    "dep:clap",
    "dep:clap_complete",
    "dep:cli-tools-db",
    "dep:colored",
    "dep:filefind-common",
    "dep:indicatif",
    "dep:rusqlite",
    "dep:serde",
    "dep:toml",
    "dep:toml_edit",
]

[dependencies]
anyhow = { workspace = true }
blake3 = { workspace = true }
cli-tools-common = { workspace = true }
cli-tools-media = { workspace = true }
rayon = { workspace = true }
walkdir = { workspace = true }

clap = { workspace = true, optional = true }
clap_complete = { workspace = true, optional = true }
cli-tools-db = { workspace = true, optional = true }
colored = { workspace = true, optional = true }
filefind-common = { workspace = true, optional = true }
indicatif = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
toml_edit = { workspace = true, optional = true }

[dev-dependencies]
cli-tools-common = { workspace = true, features = ["test-support"] }
filefind-common = { workspace = true, features = ["test-support"] }
proptest = { workspace = true }
tempfile = { workspace = true }
criterion = { workspace = true }

[[test]]
name = "dirmove_cli_tests"
required-features = ["cli"]

[[bench]]
name = "dir_move"
harness = false

[lints]
workspace = true
