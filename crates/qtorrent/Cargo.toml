[package]
name = "cli-tools-qtorrent"
description = "Add torrents to qBittorrent with automatic file renaming, show torrent stats"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"

[lib]
path = "src/lib.rs"

[[bin]]
name = "qtorrent"
path = "src/bin/qtorrent/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# Dependencies of the qtorrent binary, left out by library users with `default-features = false`.
cli = [
    "cli-tools-common/completion",
    "cli-tools-common/config",
    "cli-tools-common/diff",
    "dep:clap",
    "dep:clap_complete",
    "dep:cli-tools-version",
    "dep:colored",
    "dep:filefind-common",
    "tokio/full",
]

[dependencies]
anyhow = { workspace = true }
cli-tools-common = { workspace = true }
cli-tools-dots = { workspace = true, default-features = false }
cli-tools-version = { workspace = true, optional = true }
regex = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_bencode = { workspace = true }
serde_bytes = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
sha1 = { workspace = true }
tokio = { workspace = true, features = ["time"] }
walkdir = { workspace = true }

clap = { workspace = true, optional = true }
clap_complete = { workspace = true, optional = true }
colored = { workspace = true, optional = true }
filefind-common = { workspace = true, optional = true }

[dev-dependencies]
cli-tools-common = { workspace = true, features = ["test-support"] }
filefind-common = { workspace = true, features = ["test-support"] }
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[[test]]
name = "qtorrent_cli_tests"
required-features = ["cli"]

[lints]
workspace = true
