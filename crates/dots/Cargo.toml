[package]
name = "cli-tools-dots"
description = "Rename files to use dot formatting"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"

[lib]
path = "src/lib.rs"

[[bin]]
name = "dots"
path = "src/bin/dots/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# Dependencies of the dots binary, left out by library users with `default-features = false`.
cli = [
    "cli-tools-common/completion",
    "dep:clap",
    "dep:clap_complete",
]

[dependencies]
anyhow = { workspace = true }
cli-tools-common = { workspace = true, features = ["diff"] }
colored = { workspace = true }
indicatif = { workspace = true }
itertools = { workspace = true }
rayon = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
titlecase = { workspace = true }
toml = { workspace = true }
unicode-normalization = { workspace = true }
unicode-segmentation = { workspace = true }
walkdir = { workspace = true }

clap = { workspace = true, optional = true }
clap_complete = { workspace = true, optional = true }

[dev-dependencies]
cli-tools-common = { workspace = true, features = ["test-support"] }
proptest = { workspace = true }
tempfile = { workspace = true }
criterion = { workspace = true }

[[test]]
name = "dots_cli_tests"
required-features = ["cli"]

[[bench]]
name = "format"
harness = false

[lints]
workspace = true
