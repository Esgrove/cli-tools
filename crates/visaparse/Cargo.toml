rust_xlsxwriter = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
