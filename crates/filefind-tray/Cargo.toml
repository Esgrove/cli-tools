[package]
name = "filefind-tray"
description = "System tray application that controls the filefind daemon"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"

[[bin]]
name = "filefind-tray"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
cli-tools-common = { workspace = true, features = ["completion"] }
clap = { workspace = true }
clap_complete = { workspace = true }
dirs = { workspace = true }
filefind-common = { workspace = true, features = ["ipc"] }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
tray-icon = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-app-kit = { workspace = true, features = ["NSApplication", "NSEvent", "NSRunningApplication"] }
objc2-foundation = { workspace = true, features = ["NSDate", "NSRunLoop", "NSString", "NSThread"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
gtk = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
