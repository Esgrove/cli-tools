# Example configuration for filefind
# Copy this file to ~/.config/filefind.toml

[daemon]
# Paths to index (drives, directories, or network locations).
#
# Windows:
# - Drive letters (e.g., "C:", "D:") use fast NTFS MFT scanning
# - Specific directories (e.g., "C:\\Users", "D:\\Projects") use MFT scanning with path filtering
# - Mapped network drives (e.g., "Z:") attempt MFT first and fall back to directory walking
# - UNC paths (e.g., "\\\\server\\share") use directory walking
# - If empty on Windows, all available local NTFS drives are auto-detected (network drives are never auto-detected)
#
# macOS and Linux:
# - Explicit absolute directories are required (for example ["/Users/you/Documents", "/Volumes/Media"])
# - Empty paths fails with a configuration hint so personal directories are never scanned silently
#
# Examples:
# paths = ["C:", "D:"]                                    # Windows: entire local drives
# paths = ["C:\\Users\\Me\\Documents", "D:\\Projects"]    # Windows: specific directories
# paths = ["C:", "\\\\nas\\media"]                        # Windows: local drive + UNC path
# paths = ["/Users/me/Documents", "/Volumes/Media"]       # macOS: explicit directories
# paths = ["/home/me/Documents", "/mnt/media"]            # Linux: explicit directories
# paths = []

# Directories to exclude from indexing (case-insensitive).
# Plain entries match whole path components: "Epic" skips "D:\Games\Epic\..."
# but not "D:\Videos\EpicTrailer.mp4". Use "*text*" to match any substring.
exclude = [
    "C:\\Windows",
    "C:\\$Recycle.Bin",
    "C:\\System Volume Information",
    "C:\\ProgramData\\Microsoft",
]

# Manual path mappings from UNC prefix to mapped drive letter.
# Each entry is a [unc_prefix, drive_letter] pair.
# Used by the CLI to display search results with mapped drive letter paths
# instead of UNC paths. The database always stores the real UNC paths
# so the daemon can access them from an elevated process.
#
# Auto-detection via Win32 API is attempted first for drive letters in the configured paths.
# Manual mappings here take priority over auto-detected ones.
#
# path_mappings = [["\\\\192.168.1.106\\Home", "X"], ["\\\\server\\share", "Z"]]

# File patterns to exclude (glob syntax)
exclude_patterns = ["*.tmp", "~$*", "Thumbs.db", "*.parts"]

# Rescan interval for non-NTFS/network drives in seconds
# scan_interval_seconds = 3600

# Log level: "error", "warn", "info", "debug", "trace"
# log_level = "info"

# Verbose output (typically set via CLI --verbose flag)
# verbose = false

# Database location.
# Defaults:
#   Windows: %LOCALAPPDATA%\filefind\filefind.db
#   macOS:   ~/Library/Application Support/filefind/filefind.db
#   Linux:   ${XDG_DATA_HOME:-~/.local/share}/filefind/filefind.db
# Can also be overridden with the FILEFIND_DB environment variable.
# database_path = ""

# Force clean scan (delete existing entries before inserting new ones).
# force_clean_scan = false

[cli]
# Default output format:
#   "list"    - list of paths
#   "name"    - file names only (no full paths)
#   "grouped" - files grouped by directory (default)
#   "info"    - paths with file size
# format = "grouped"

# Maximum number of results to show (0 = unlimited)
# max_results = 100

# Enable colored output
# color = true

# Case-sensitive search by default
# case_sensitive = false

# Show hidden files in results
# show_hidden = false

# Emit clickable terminal hyperlinks (OSC 8) for result paths:
#   "auto"   - only when writing to a terminal known to support them (default)
#   "always" - always, even when the output is redirected or piped
#   "never"  - never
# Ctrl+Click (Windows Terminal, Warp) or Cmd+Click (iTerm2) opens the path
# with the application the operating system associates with it.
# hyperlinks = "auto"

# URI scheme used for terminal hyperlinks.
# "file" (default) hands the path to the default application for its type.
# Any other value is emitted as "<scheme>://<path>" and requires a matching
# protocol handler to be registered with the operating system.
# hyperlink_scheme = "file"
