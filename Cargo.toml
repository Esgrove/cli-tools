[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "11.2.0"
edition = "2024"
authors = ["Esgrove <esgrove@outlook.com>"]
license = "MIT"
repository = "https://github.com/Esgrove/cli-tools"
rust-version = "1.100"

[workspace.dependencies]
cli-tools-common = { path = "crates/common" }
cli-tools-dots = { path = "crates/dots" }
cli-tools-media = { path = "crates/media" }

anyhow = "1.0.104"
blake3 = { version = "1.8.7", features = ["mmap", "rayon"] }
jiff = "0.2.45"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
colored = "3.1.1"
crossterm = "0.29.0"
ctrlc = "3.5.2"
difference = "2.0.0"
dirs = "7.0.0"
dunce = "1.0.5"
encoding_rs = "0.8.44"
fearless_simd = "1.2.0"
fearless_simd_macros = "0.1.0"
futures = "0.3.34"
git2 = { version = "0.21.0", features = ["ssh", "https"] }
ignore = "0.4.34"
indicatif = "0.18.6"
itertools = "0.15.0"
num_cpus = "1.17.0"
ratatui = "0.30.2"
rayon = "1.12.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["cookies", "form", "multipart"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
rust_xlsxwriter = { version = "0.102.0", features = ["jiff", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_bencode = "0.2.4"
serde_bytes = "0.11.19"
serde_json = "1.0"
serde_path_to_error = "0.1.20"
sha1 = "0.11.0"
tempfile = "3.27.0"
titlecase = "3.6.0"
tokio = "1.54.1"
toml = "1.2.1"
toml_edit = "0.25.19"
trash = "5.3.0"
unicode-normalization = "0.1.26"
unicode-segmentation = "1.13.3"
walkdir = "2.5.0"
criterion = { version = "0.8.2", features = ["html_reports"] }
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[profile.dev]
incremental = true

[profile.release]
lto = true
# https://doc.rust-lang.org/rustc/codegen-options/index.html#codegen-units
codegen-units = 1

# Release build that keeps debug symbols, so a profiler can name the inlined frames.
# Build with: cargo build --profile profiling --bin <name>
[profile.profiling]
inherits = "release"
debug = true

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# https://rust-lang.github.io/rust-clippy/master/index.html
fn_params_excessive_bools = "allow"
struct_excessive_bools = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"

cast_possible_wrap = "deny"
char_lit_as_u8 = "deny"
enum_glob_use = "deny"
exit = "deny"
fn_to_numeric_cast = "deny"
fn_to_numeric_cast_with_truncation = "deny"
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "deny"
ptr_as_ptr = "deny"
string_slice = "deny"
unchecked_time_subtraction = "deny"
unimplemented = "deny"
unnecessary_cast = "deny"
unwrap_used = "deny"
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
