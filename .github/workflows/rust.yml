name: Rust

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rust.yml"
      - "**.rs"
      - "Cargo.lock"
      - "**/Cargo.toml"
  pull_request:
    paths:
      - ".github/workflows/rust.yml"
      - "**.rs"
      - "Cargo.lock"
      - "**/Cargo.toml"

# Cancel previous runs for PRs but not pushes to main
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Override target-cpu=native from .cargo/config.toml to avoid illegal instruction
  # errors on GitHub Actions runners with varying CPU capabilities
  RUSTFLAGS: ""

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Linux tray dependencies
        if: runner.os == 'Linux'
        # The filefind-tray crate links against GTK and the app indicator library on Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - name: Build
        run: cargo build --workspace

      - name: Run tests
        run: cargo test --workspace --no-fail-fast

  lint:
    strategy:
      matrix:
        # Run clippy on Linux, macOS, and Windows so platform-gated code
        # (NTFS/USN/Win32, macOS AppKit tray, and Linux GTK/Unix paths) is linted everywhere
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy,rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Linux tray dependencies
        if: runner.os == 'Linux'
        # The filefind-tray crate links against GTK and the app indicator library on Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check --verbose

      - name: Check minimal library features
        if: runner.os == 'Linux'
        run: cargo check -p filefind-common --no-default-features

      - name: Lint
        # Exit non-zero if there are any warnings
        # https://doc.rust-lang.org/stable/clippy/usage.html
        run: cargo clippy --workspace --all-targets -- -Dwarnings
